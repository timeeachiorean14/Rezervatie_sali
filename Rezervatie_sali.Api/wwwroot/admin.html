<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>StudySpace — Portal Bibliotecar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<!-- MENIU NAVIGARE -->
<nav class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-amber-600 text-white flex items-center justify-center font-bold">B</div>
            <span class="font-bold text-slate-900">StudySpace Admin</span>
        </div>
        <div class="flex gap-2">
            <a href="index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">🎓 Portal Student</a>
            <a href="admin.html" class="px-4 py-2 rounded-lg text-sm font-semibold bg-amber-50 text-amber-800">🏛️ Portal Bibliotecar</a>
            <a href="events.html" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">⚡ Coadă Evenimente</a>
        </div>
    </div>
</nav>

<main class="max-w-6xl mx-auto px-6 py-8 space-y-6">
    <!-- STATISTICI UTILIZARE (OPERAȚIA 3.3) -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4" id="statsBar"></div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- CERERI DE APROBARE (OPERAȚIA 2.1) -->
        <section class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <h2 class="text-lg font-bold text-slate-900 mb-1">Cereri Care Necesită Aprobare</h2>
            <p class="text-xs text-slate-500 mb-4">Rezervări pentru echipamente speciale sau intervale de 4 ore</p>

            <div class="overflow-hidden rounded-xl border border-slate-200">
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500">
                    <tr>
                        <th class="py-3 px-4">ID</th>
                        <th class="py-3 px-4">Student</th>
                        <th class="py-3 px-4">Resursă</th>
                        <th class="py-3 px-4 text-right">Decizie</th>
                    </tr>
                    </thead>
                    <tbody id="pendingTable" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>

        <!-- PENALIZĂRI STUDENȚI (OPERAȚIA 3.2) -->
        <section class="lg:col-span-5 bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <h2 class="text-lg font-bold text-slate-900 mb-1">Monitorizare Penalizări</h2>
            <p class="text-xs text-slate-500 mb-4">3 No-Show-uri = Suspendare automată 7 zile</p>

            <div class="overflow-hidden rounded-xl border border-slate-200">
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500">
                    <tr>
                        <th class="py-3 px-4">Student</th>
                        <th class="py-3 px-4">Absențe</th>
                        <th class="py-3 px-4 text-right">Cont</th>
                    </tr>
                    </thead>
                    <tbody id="usersTable" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>
    </div>
</main>

<script>
    async function decide(id, approve) {
        await fetch(`/api/reservations/${id}/decision?approve=${approve}`, { method: 'POST' });
        refresh();
    }

    async function refresh() {
        const res = await fetch('/api/dashboard');
        const data = await res.json();

        document.getElementById('statsBar').innerHTML = `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="text-xs font-semibold text-slate-400 uppercase">Total Rezervări</div>
                    <div class="text-3xl font-bold text-slate-900 mt-1">${data.stats.totalReservations}</div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="text-xs font-semibold text-emerald-600 uppercase">Prezențe Confirmate</div>
                    <div class="text-3xl font-bold text-emerald-600 mt-1">${data.stats.activeCount}</div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="text-xs font-semibold text-rose-600 uppercase">Absențe (No-Show)</div>
                    <div class="text-3xl font-bold text-rose-600 mt-1">${data.stats.noShowCount}</div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="text-xs font-semibold text-indigo-600 uppercase">Grad Ocupare</div>
                    <div class="text-3xl font-bold text-indigo-600 mt-1">${data.stats.occupancyRatePercent}%</div>
                </div>
            `;

        const pending = data.reservations.filter(r => r.status === 'PENDING');
        document.getElementById('pendingTable').innerHTML = pending.length
            ? pending.map(r => `
                    <tr>
                        <td class="py-3 px-4 font-mono text-xs">#${r.id}</td>
                        <td class="py-3 px-4 font-medium">${r.userName}</td>
                        <td class="py-3 px-4">${r.resourceName} (${r.durationHours}h)</td>
                        <td class="py-3 px-4 text-right space-x-1">
                            <button onclick="decide(${r.id}, true)" class="px-3 py-1 rounded-lg text-xs font-semibold bg-emerald-600 text-white hover:bg-emerald-700">Aprobă</button>
                            <button onclick="decide(${r.id}, false)" class="px-3 py-1 rounded-lg text-xs font-semibold bg-rose-600 text-white hover:bg-rose-700">Respinge</button>
                        </td>
                    </tr>`).join('')
            : `<tr><td colspan="4" class="py-6 text-center text-slate-400">Nicio cerere în așteptare.</td></tr>`;

        document.getElementById('usersTable').innerHTML = data.users.map(u => `
                <tr>
                    <td class="py-3 px-4 font-medium">${u.name}</td>
                    <td class="py-3 px-4 font-bold">${u.noShowCount} / 3</td>
                    <td class="py-3 px-4 text-right">
                        ${u.suspendedUntil
            ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-100 text-rose-700">BLOCAT</span>`
            : `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700">ACTIV</span>`}
                    </td>
                </tr>`).join('');
    }

    refresh();
    setInterval(refresh, 1500);
</script>
</body>
</html>
