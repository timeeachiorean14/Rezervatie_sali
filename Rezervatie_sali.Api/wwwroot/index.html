<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>StudySpace — Portal Student</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<!-- MENIU NAVIGARE -->
<nav class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold">S</div>
            <span class="font-bold text-slate-900">StudySpace</span>
        </div>
        <div class="flex gap-2">
            <a href="index.html" class="px-4 py-2 rounded-lg text-sm font-semibold bg-indigo-50 text-indigo-700">🎓 Portal Student</a>
            <a href="admin.html" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">🏛️ Portal Bibliotecar</a>
            <a href="events.html" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">⚡ Coadă Evenimente</a>
        </div>
    </div>
</nav>

<main class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- FORMULAR REZERVARE (5 coloane) -->
    <section class="lg:col-span-5 bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
        <h2 class="text-lg font-bold text-slate-900 mb-1">Rezervă un Spațiu</h2>
        <p class="text-xs text-slate-500 mb-5">Max 2h/zi individual • Max 4h/zi sală de grup</p>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Cont Student</label>
                <select id="userSelect" class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm"></select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Tip Spațiu</label>
                <select id="typeFilter" onchange="loadResources()" class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm">
                    <option value="ALL">Toate spațiile</option>
                    <option value="INDIVIDUAL">Individual (max 2h)</option>
                    <option value="GROUP">Sală de Grup (max 4h)</option>
                    <option value="EQUIPMENT">Echipament Special (necesită aprobare)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Resursă</label>
                <select id="resourceSelect" class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm"></select>
            </div>
            <div class="grid grid-cols-3 gap-3">
                <div class="col-span-2">
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Data și Ora</label>
                    <input type="datetime-local" id="startTime" class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Ore</label>
                    <input type="number" id="duration" value="2" min="1" max="6" class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm">
                </div>
            </div>
            <button onclick="createReservation()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition">
                Trimite Rezervarea
            </button>
            <div id="feedback" class="hidden p-3 rounded-xl text-xs font-medium"></div>
        </div>
    </section>

    <!-- REZERVĂRILE MELE & CHECK-IN (7 coloane) -->
    <section class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
        <h2 class="text-lg font-bold text-slate-900 mb-1">Rezervările Mele & Check-In</h2>
        <p class="text-xs text-slate-500 mb-5">Confirmă prezența în primele 15 minute pentru a evita penalizarea</p>

        <div class="overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full text-left border-collapse text-sm">
                <thead class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500">
                <tr>
                    <th class="py-3 px-4">ID</th>
                    <th class="py-3 px-4">Student</th>
                    <th class="py-3 px-4">Spațiu</th>
                    <th class="py-3 px-4">Status</th>
                    <th class="py-3 px-4 text-right">Acțiune</th>
                </tr>
                </thead>
                <tbody id="reservationsTable" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
    const d = new Date(Date.now() + 3600000);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    document.getElementById('startTime').value = d.toISOString().slice(0, 16);

    async function loadResources() {
        const type = document.getElementById('typeFilter').value;
        const res = await fetch(`/api/resources?type=${type}`);
        const data = await res.json();
        document.getElementById('resourceSelect').innerHTML = data.map(r =>
            `<option value="${r.id}">${r.name} (${r.capacity} pers. - ${r.equipment})</option>`
        ).join('');
    }

    async function createReservation() {
        const fb = document.getElementById('feedback');
        const res = await fetch('/api/reservations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId: parseInt(document.getElementById('userSelect').value),
                resourceId: parseInt(document.getElementById('resourceSelect').value),
                startTime: document.getElementById('startTime').value,
                durationHours: parseInt(document.getElementById('duration').value)
            })
        });
        fb.classList.remove('hidden', 'bg-rose-50', 'text-rose-700', 'bg-emerald-50', 'text-emerald-700');
        if (!res.ok) {
            const err = await res.json();
            fb.classList.add('bg-rose-50', 'text-rose-700');
            fb.innerText = '⚠️ ' + err.error;
        } else {
            const ok = await res.json();
            fb.classList.add('bg-emerald-50', 'text-emerald-700');
            fb.innerText = `✅ Rezervare #${ok.id} înregistrată (${ok.status})!`;
        }
        refresh();
    }

    async function checkIn(id) {
        await fetch(`/api/reservations/${id}/check-in`, { method: 'POST' });
        refresh();
    }

    async function refresh() {
        const res = await fetch('/api/dashboard');
        const data = await res.json();

        const sel = document.getElementById('userSelect');
        const cur = sel.value;
        sel.innerHTML = data.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
        if (cur) sel.value = cur;

        document.getElementById('reservationsTable').innerHTML = data.reservations.length
            ? data.reservations.map(r => `
                    <tr>
                        <td class="py-3 px-4 font-mono text-xs text-slate-500">#${r.id}</td>
                        <td class="py-3 px-4 font-medium">${r.userName}</td>
                        <td class="py-3 px-4">${r.resourceName}<br><span class="text-xs text-slate-400">${new Date(r.startTime).toLocaleString('ro-RO')} (${r.durationHours}h)</span></td>
                        <td class="py-3 px-4"><span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100">${r.status}</span></td>
                        <td class="py-3 px-4 text-right">
                            ${r.status === 'CONFIRMED' ? `<button onclick="checkIn(${r.id})" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white hover:bg-emerald-700">✓ Check-In</button>` : '—'}
                        </td>
                    </tr>`).join('')
            : `<tr><td colspan="5" class="py-6 text-center text-slate-400">Nicio rezervare încă.</td></tr>`;
    }

    loadResources();
    refresh();
    setInterval(refresh, 1500);
</script>
</body>
</html>
